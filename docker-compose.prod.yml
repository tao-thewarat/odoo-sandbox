# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires .env (see .env.example) and proxy/htpasswd (see README.md).
services:
  api:
    restart: always
    ports: !reset []

  worker:
    restart: always

  proxy:
    restart: always
    environment:
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:?set SANDBOX_DOMAIN in .env}
      MANAGER_AUTH: '"Odoo Sandbox"'
    volumes:
      - ./proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./proxy/htpasswd:/etc/nginx/htpasswd:ro
    ports: !override
      - "${PROXY_BIND:-0.0.0.0:80}:80"
